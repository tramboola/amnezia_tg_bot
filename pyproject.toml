[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "amnezia-tg-bot"
version = "0.1.0"
description = "Administrator Telegram bot for self-hosted AmneziaWG 3.1"
requires-python = ">=3.12"
dependencies = [
  "python-telegram-bot>=22,<23",
  "httpx>=0.27,<0.29",
  "cryptography>=44,<48",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
amnezia-bot = "amnezia_bot.__main__:main"
amnezia-manager = "amnezia_bot.rpc:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amnezia_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["work", ".docs/agents/tools"]

[tool.ruff.lint]
select = ["E", "F", "I"]
